    { id: 's0-1', block: 'Monday Check-in', time: 'Mon 8:15 - 8:40 AM', title: 'Check-in & Breakfast', presenterId: null, audience: 'All', room: 'FBC Worship Center', description: 'Check-in continues in the FBC Worship Center (100 Station Street); coffee, water, and breakfast bars provided. (Doors open at 8:00.)' },

    { id: 's1-1', block: 'Session One', time: 'Mon 10:30 - 11:30 AM', title: 'Intentional Design: Crafting Professional Learning that Engages, Connects, and Inspires', presenterId: 'siler', audience: 'L', room: 'Building A', description: 'Professional learning doesn’t happen by accident — it happens by design. In this engaging session, we’ll explore how to be purposeful and strategic in crafting professional development that truly resonates. From authentic invitations and thoughtful entry points that invite authentic engagement and spark curiosity, to collaborative structures that foster connection and maximize the wisdom in the room, we’ll unpack how intentional design leads to deeper engagement and meaningful learning. We’ll also explore the power of surprise and delight — those creative, joyful elements that elevate a learning experience from ordinary to transformational. Participants will leave with practical strategies and fresh ideas to design professional learning that connects, inspires, and makes a lasting impact.' },

    { id: 's1-5', block: 'Session One', time: 'Mon 10:30 - 11:30 AM', title: 'For the Love of Reading', presenterId: 'rose', audience: 'K-5', room: 'Building E', description: 'What are you reading? I asked my grandson. "Nothing." You sure? "Prolly some passages. But nope." He might as well have stabbed me. In this session, learn how we captivate imaginations and possibilities regarding what reading could be: loved and enjoyed. We\'ll start with book talks, strategies, and then dip in and out of resources so that your kids will say they are reading all kinds of stuff.' },
    { id: 'lunch-1', block: 'Monday Lunch', time: 'Mon 11:30 AM - 1:00 PM', title: 'Lunch on Your Own', presenterId: null, audience: 'All', room: 'Port Aransas Restaurants', description: 'Enjoy book signings and time with presenters, and lunch on your own at one of Port A’s many fabulous restaurants! Or shop. Or go to the beach.' },
    { id: 's2-1', block: 'Session Two', time: 'Mon 1:00 - 2:00 PM', title: 'Leadership Panel', presenterId: 'mckinney', additionalPresenters: ['garrett', 'robbins', 'davis', 'mayer'], audience: 'L', room: 'Building A', description: 'Behind the Scenes: The Work of Authentic Instructional Leadership. Ever wonder what leadership really looks like behind the scenes, beyond the title and the to-do list? In this candid panel, campus administrators and instructional leaders share real-world insights on building trust, staying focused on instruction, and navigating daily challenges. Designed for both aspiring and current leaders, this session offers an honest look at the work and impact of instructional leadership, along with practical takeaways you can use right away.' },
    { id: 's2-2', block: 'Session Two', time: 'Mon 1:00 - 2:00 PM', title: 'Transferencia Académica: El Poder de los Cognados', presenterId: 'caudillo', additionalPresenters: ['deanda'], audience: '4-12', room: 'Building B', description: 'Did you understand the title? Did you use your cognates? In this engaging session, educators will explore how to strategically leverage cognates to accelerate English language development for Emergent Bilingual (EB) students who speak Spanish. Participants will examine the morphological connections between English and Spanish, including common patterns such as English nouns ending in -tion corresponding to Spanish -ción (e.g., information/información, education/educación). By understanding these linguistic bridges, teachers can unlock powerful opportunities for students to make connections across languages, expand vocabulary, and deepen comprehension. Attendees will leave with practical strategies to intentionally integrate cognate instruction into their classrooms, empowering students to better understand how English and Spanish “work” together.' },

    { id: 's2-4', block: 'Session Two', time: 'Mon 1:00 - 2:00 PM', title: 'Picture Books for STAAR? Are You Kidding?', presenterId: 'briseno', audience: '2-10', room: 'Building D', description: 'Nope! We’re not kidding. Using picture books, these tried-and-true strategies will relax kids into solid academic work, no matter their age or ability. You will leave this session with strategies you can use tomorrow to get students writing high scoring responses to reading, especially those required for the SCRs and the ECRs on STAAR, and weaving reading and writing together. Plus, you’ll get loads of resources for teaching writer’s craft, grammar, and truisms.' },
    { id: 's2-5', block: 'Session Two', time: 'Mon 1:00 - 2:00 PM', title: 'Reading Lenses: Transferring Analysis to the ECR', presenterId: 'martin', audience: '3-12', room: 'Building E', description: 'This session uses the Reading Lenses strategy to give students "the academic gift that keeps on giving." In other words, students will discover how to analyze a selection for its potential to produce an extended constructed response prompt and to determine possible answers with text evidence. Join us as we practice this academically empowering skill!' },
    { id: 's3-1', block: 'Session Three', time: 'Mon 2:15 - 3:45 PM', title: 'Cultivating a Little Genius While Making Shakespeare Painless', presenterId: 'bernabei', audience: 'All', room: 'Building E', description: 'Modeling a lesson from Gretchen’s new book, participants in this extended general session will do a little painless writing; then ease in to reading (and understanding!) one of Shakespeare’s greatest soliloquies. Honestly! Genius is all around us.' },
    { id: 'break-2', block: 'Tuesday Breakfast', time: 'Tue 8:15 - 8:45 AM', title: 'Coffee & Breakfast Bars', presenterId: null, audience: 'All', room: 'FBC Worship Center', description: 'Enjoy coffee and breakfast bars in FBC Worship Center.' },
    { id: 's4-1', block: 'Session Four', time: 'Tue 8:45 - 9:45 AM', title: 'Whatever It Takes: Life. Lessons. Leadership.', presenterId: 'davis', audience: 'L', room: 'Building A', description: 'Adversity does not simply test leadership—it reveals it. In this inspiring session, centered on the idea of leading through difficult seasons, Clay introduces a practical three-step approach to understanding and strengthening your personal leadership style when challenges arise. Attendees will reflect on how adversity impacts decision-making, relationships, culture, and personal growth; and leave with a renewed sense of purpose, a deeper understanding of leadership under pressure, and actionable strategies for leading with greater resilience, ownership, and impact in both their professional and personal lives.' },
    { id: 's4-2', block: 'Session Four', time: 'Tue 8:45 - 9:45 AM', title: 'Transferencia Académica: El Poder de los Cognados', presenterId: 'caudillo', additionalPresenters: ['deanda'], audience: '4-12', room: 'Building B', description: 'Did you understand the title? Did you use your cognates? In this engaging session, educators will explore how to strategically leverage cognates to accelerate English language development for Emergent Bilingual (EB) students who speak Spanish. Participants will examine the morphological connections between English and Spanish, including common patterns such as English nouns ending in -tion corresponding to Spanish -ción (e.g., information/información, education/educación). By understanding these linguistic bridges, teachers can unlock powerful opportunities for students to make connections across languages, expand vocabulary, and deepen comprehension. Attendees will leave with practical strategies to intentionally integrate cognate instruction into their classrooms, empowering students to better understand how English and Spanish “work” together.' },
    { id: 's4-3', block: 'Session Four', time: 'Tue 8:45 - 9:45 AM', title: 'AI for Instructional Redesign', presenterId: 'ketteman', audience: 'K-12', room: 'Building C', description: 'We’re upgrading how we analyze, evaluate, and create in the classroom. Participants will explore how AI practices (not just tools) can deepen, rather than replace, higher-order thinking—ensuring students are active thinkers, not just passive responders in a world of generative technology. The learning landscape may be evolving, but good teaching stands the test of time.' },
    { id: 's4-4', block: 'Session Four', time: 'Tue 8:45 - 9:45 AM', title: 'QA12345: A sure-fire method for students who struggle', presenterId: 'bernabei', audience: '3-10', room: 'Building D', description: 'This session will give a leg-up to students who just don’t get it, capitalizing on the knowledge they have known since they began to talk. It works for more than STAAR, too.' },
    { id: 's4-5', block: 'Session Four', time: 'Tue 8:45 - 9:45 AM', title: 'If You Build It, They Will Learn: Climbing the Ladder to College Readiness', presenterId: 'mayer', audience: '6-12', room: 'Building E', description: 'This session focuses on scaffolding assignments using students’ own interests with the skills they need to be successful in college. Includes active reading and responding to text; expository writing, research and documentation skills; and academic behaviors.' },
    { id: 's5-1', block: 'Session Five', time: 'Tue 10:00 - 11:00 AM', title: 'Keep the Candle Burning: How to Build, Practice, and Teach Resilience', presenterId: 'mayer', audience: '3-12', room: 'Building A', description: `“My candle burns at both ends; It will not last the night; But ah, my foes, and oh, my friends - it gives a lovely light!” – Edna St. Vincent Millay\n\nPeople are like candles. We are here such a short time. But some “candles” seem to burn brighter, last longer. Like a trick birthday candle, they can’t be put out. The difference is resilience. In this powerful presentation, Melanie suggests practical strategies for building and maintaining resilience, growth, and impact - because real resilience isn’t just surviving; it’s thriving. And it’s helping others thrive as well – at work, at home, and at play.` },
    { id: 's5-2', block: 'Session Five', time: 'Tue 10:00 - 11:00 AM', title: 'Every Learner Counts: Practical Supports', presenterId: 'spellane', audience: '4-12', room: 'Building B', description: 'This session focuses on practical, classroom-ready strategies to support emergent bilingual, special education, and 504 students through intentional instructional design. Participants will explore ways to reduce barriers, scaffold learning, and increase access to grade-level content while maintaining high expectations. Emphasis is placed on inclusive practices that benefit all learners and can be implemented immediately across content areas.' },
    { id: 's5-3', block: 'Session Five', time: 'Tue 10:00 - 11:00 AM', title: 'Write. Read. Discuss. Repeat.', presenterId: 'saverance', audience: '6-12', room: 'Building C', description: 'This student-centered approach to instruction transforms how middle and high school students engage with complex texts. Through a simple, repeatable cycle of purposeful writing, active reading, and meaningful discussion, students move from passive participation to deep thinking. Strongly aligned with the student-led learning component of T-TESS, this strategy builds confidence, strengthens comprehension, and elevates student voice—providing scaffolding for struggling readers, meaningful challenge for on-level students, and enrichment for advanced learners. Walk away with a practical, ready-to-use routine you can implement immediately to boost engagement and get students doing the thinking.' },
    { id: 's5-4', block: 'Session Five', time: 'Tue 10:00 - 11:00 AM', title: 'Picture Books for STAAR? Are You Kidding?', presenterId: 'briseno', audience: '2-10', room: 'Building D', description: 'Nope! We’re not kidding. Using picture books, these tried-and-true strategies will relax kids into solid academic work, no matter their age or ability. You will leave this session with strategies you can use tomorrow to get students writing high scoring responses to reading, especially those required for the SCRs and the ECRs on STAAR, and weaving reading and writing together. Plus, you’ll get loads of resources for teaching writer’s craft, grammar, and truisms.' },
    { id: 's5-5', block: 'Session Five', time: 'Tue 10:00 - 11:00 AM', title: 'The Critical Reading Process', presenterId: 'holland', audience: '6-12', room: 'Building E', description: 'Learn how to implement the Critical Reading Process through its three purposeful phases—activate, engage, and extend—to strengthen student comprehension, deepen critical thinking, and build independent, strategic readers. Explore classroom-ready strategies for building background knowledge and vocabulary, while guiding students through a purposeful 1st Read and skillful 2nd (close) read, as well as designing meaningful written responses aligned to key skills. Attendees walk away with ready-to-use tools and instructional moves that can be immediately applied across content areas to increase student engagement and achievement.' },
    { id: 'lunch-2', block: 'Tuesday Lunch', time: 'Tue 11:00 AM - 12:30 PM', title: 'Lunch on Your Own', presenterId: null, audience: 'All', room: 'Port Aransas Restaurants', description: 'Enjoy time with presenters, book signings, and lunch on your own at another of Port A’s fabulous restaurants! Or shop. Or go to the beach.' },
    { id: 's6-1', block: 'Session Six', time: 'Tue 12:30 - 1:30 PM', title: 'The Best Leaders Don’t Wait for Calm Seas', presenterId: 'mckinney', audience: 'L', room: 'Building A', description: 'In this engaging session inspired by The Instructional Leader in You, you’ll explore practical strategies that help you lead from where you are, no matter your current role. Learn how small, intentional actions can build your influence, strengthen relationships, and prepare you for the next step while making an impact right now. Whether you\'re stepping into leadership or already serving in it, you’ll leave with clear, effective moves to grow as the instructional leader your campus needs.' },
    { id: 's6-2', block: 'Session Six', time: 'Tue 12:30 - 1:30 PM', title: 'Harvesting Shells with ELLS', presenterId: 'alambarrio', audience: '6-12', room: 'Building B', description: 'A current classroom teacher and biliteracy consultant shares proven classroom strategies that will empower language learners to harvest words and patterns within the English language as they become more engaged, confident writers and readers. Heather will also connect this work with the new ELPS so you can plan for strategic implementation. This session will be powerful and deep, just like the ocean!' },
    { id: 's6-3', block: 'Session Six', time: 'Tue 12:30 - 1:30 PM', title: 'Specific Support for Students with Dyslexia', presenterId: 'speegle', additionalPresenters: ['kypke'], audience: '3-8', room: 'Building C', description: 'In this interactive session, participants will engage in simulation experiences designed to provide insight into what it feels like to navigate the classroom with dyslexia. The session will explore the comorbidity of ADHD and dyslexia, as well as the impact these challenges can have across all academic areas—not just reading and writing. Presenters will share practical strategies including flexible seating, movement integration, accommodations across content areas, and small-group testing supports that help students succeed.' },
    { id: 's6-4', block: 'Session Six', time: 'Tue 12:30 - 1:30 PM', title: 'Adding Depth: Kernel Essay Elaboration Strategies', presenterId: 'martindell', audience: '4-12', room: 'Building D', description: 'This session builds upon the kernel essay’s organization by: 1. using the depth charge elaboration strategy to build paragraphs where each sentence connects to the central idea of the sentence that comes before, and 2. using text evidence from a visual source to add depth to writing. To do this we will begin by writing a kernel essay using the Perspectives from a Painting text structure.' },
    { id: 's6-5', block: 'Session Six', time: 'Tue 12:30 - 1:30 PM', title: 'Reading Lenses 201: Focus on Poetry', presenterId: 'martin', audience: '3-12', room: 'Building E', description: 'Is authentic reading engagement truly possible, and can we help develop critical readers who will carry these skills throughout life? Absolutely! Using the "Reading Lenses” strategy with rich texts, teachers will learn how to boost their students’ reading interactions, immediately facilitate rigorous analysis, and empower students with confidence and skills. This session also tremendously helps teachers better understand the “thinking” within their TEKS.' },
    { id: 's7-1', block: 'Session Seven', time: 'Tue 1:45 - 3:00 PM', title: 'Closing General Session', presenterId: 'mayer', audience: 'All', room: 'Building E', description: 'Don’t miss Melanie’s closing keynote address. Several awesome door prizes, including Consuela bags, Yetis, hotel stays, and more - and a grand prize package valued over $1000 will be awarded during this final session! Receive PD certificates here, too.' }
];

const MapComponent = ({ points, centerLat, centerLng, zoomLevel }) => {
    const mapRef = useRef(null);
    const mapInstance = useRef(null);
    useEffect(() => {
        if (!window.L || !mapRef.current)
            return;
        if (!mapInstance.current) {
            mapInstance.current = window.L.map(mapRef.current, {
                scrollWheelZoom: false,
                tap: false
            }).setView([centerLat, centerLng], zoomLevel);
            window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapInstance.current);
        }
        else {
            mapInstance.current.setView([centerLat, centerLng], zoomLevel);
        }
        mapInstance.current.eachLayer((layer) => {
            if (layer instanceof window.L.Marker) {
                mapInstance.current.removeLayer(layer);
            }
        });
        points.forEach(loc => {
            let markerColor = loc.type === 'shop' ? 'blue' : 'orange';
            const icon = window.L.icon({
                iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/31f7dfe9dfe6dc55ab0eb43b7360c9c8dbe4b18f/img/marker-icon-2x-${markerColor}.png`,
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });
            const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(loc.name + " Port Aransas, TX")}`;
            const popupContent = `
                        <div style="text-align: center; min-width: 150px; font-family: sans-serif;">
                            <strong>${loc.name}</strong><br/>
                            <span style="font-size: 0.85em; color: #475569;">${loc.desc || ''}</span>
                            <div style="margin-top: 10px;">
                                <a href="${gmapsUrl}" target="_blank" style="background-color: #0f766e; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; display: inline-block;">
                                    <i class="fas fa-external-link-alt" style="margin-right: 4px;"></i> Open in Maps
                                </a>
                            </div>
                        </div>
                    `;
            window.L.marker([loc.lat, loc.lng], { icon }).addTo(mapInstance.current).bindPopup(popupContent);
        });
        setTimeout(() => {
            if (mapInstance.current) {
                mapInstance.current.invalidateSize();
            }
        }, 200);
    }, [points, centerLat, centerLng, zoomLevel]);
    useEffect(() => {
        return () => {
            if (mapInstance.current) {
                mapInstance.current.remove();
                mapInstance.current = null;
            }
        };
    }, []);
    return React.createElement("div", { ref: mapRef, className: "w-full h-[320px] md:h-[420px] rounded-xl border border-slate-200 shadow-inner" });
};
